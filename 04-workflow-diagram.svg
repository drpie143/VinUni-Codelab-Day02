<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect width="1400" height="850" fill="#f7f8fa"/>
  <text x="700" y="50" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#16324f">Vinhomes Resident Service Copilot - Current-State Workflow</text>
  <text x="700" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#52606d">Baseline giả định: 9-20 phút/yêu cầu | 🔴 bottleneck | 🔄 handoff</text>
  <g font-family="Arial" stroke-width="1.5">
    <rect x="50" y="145" width="265" height="285" rx="10" fill="#ffffff" stroke="#8fd0f0"/>
    <rect x="350" y="145" width="265" height="285" rx="10" fill="#fffafb" stroke="#f1787d"/>
    <rect x="650" y="145" width="265" height="285" rx="10" fill="#fffdf7" stroke="#eab24f"/>
    <rect x="950" y="145" width="265" height="285" rx="10" fill="#fffafb" stroke="#f1787d"/>
    <rect x="55" y="155" width="70" height="23" rx="4" fill="#ffffff" stroke="#b7c7d7"/><text x="90" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#24364d">BƯỚC 01</text>
    <rect x="220" y="155" width="80" height="23" rx="4" fill="#e4f5ff" stroke="#0787cf"/><text x="260" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#0071b5">INPUT STAGE</text>
    <text x="65" y="210" font-size="17" font-weight="bold" fill="#142038">Tiếp nhận đa kênh</text><text x="65" y="230" font-size="12" fill="#52606d">Cư dân gửi qua App / Hotline / Quầy</text>
    <rect x="65" y="242" width="78" height="24" rx="5" fill="#0787cf"/><text x="104" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">TG: 2 phút</text>
    <text x="65" y="290" font-size="12" fill="#34465c">Cư dân gửi phản ánh tự do kèm hình ảnh,</text><text x="65" y="307" font-size="12" fill="#34465c">video hoặc mô tả thủ tục cần hỗ trợ.</text>
    <text x="65" y="334" font-size="12" fill="#34465c">• Tiếp nhận từ App Vinhomes Resident</text><text x="65" y="351" font-size="12" fill="#34465c">• Dữ liệu phân tán, chưa chuẩn hóa</text><text x="65" y="368" font-size="12" fill="#34465c">• Chờ nhân viên tạo ticket thủ công</text>
    <rect x="65" y="388" width="235" height="31" rx="5" fill="#f4f7fa" stroke="#ccd7e2"/><text x="75" y="401" font-size="10" fill="#52606d">In: Mô tả sự cố / Căn hộ / Tòa nhà</text><text x="75" y="414" font-size="10" font-weight="bold" fill="#34465c">Out: Ticket chờ trong hàng đợi</text>
    <rect x="355" y="155" width="70" height="23" rx="4" fill="#ffffff" stroke="#b7c7d7"/><text x="390" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#24364d">BƯỚC 02</text>
    <rect x="525" y="155" width="80" height="23" rx="4" fill="#ffe7e8" stroke="#ed1c24"/><text x="565" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#d01820">BOTTLENECK</text>
    <text x="365" y="210" font-size="17" font-weight="bold" fill="#142038">Đọc &amp; phân loại kép</text><text x="365" y="230" font-size="12" fill="#52606d">Nhân viên CSKH / BQL tòa nhà</text>
    <rect x="365" y="242" width="78" height="24" rx="5" fill="#ed1c24"/><text x="404" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">TG: 6 phút</text>
    <text x="365" y="290" font-size="12" fill="#34465c">Đọc hiểu văn bản và phân tách thủ công</text><text x="365" y="307" font-size="12" fill="#34465c">2 nhóm nghiệp vụ hoàn toàn khác biệt:</text>
    <rect x="365" y="318" width="235" height="30" rx="4" fill="#fff0f1" stroke="#f1787d"/><text x="375" y="337" font-size="11" font-weight="bold" fill="#c51f28">Nhánh 1: Khiếu nại / Sự cố kỹ thuật</text>
    <rect x="365" y="354" width="235" height="30" rx="4" fill="#e7f5ff" stroke="#54aede"/><text x="375" y="373" font-size="11" font-weight="bold" fill="#0875ad">Nhánh 2: Hướng dẫn thủ tục cư dân</text>
    <rect x="365" y="394" width="235" height="25" rx="5" fill="#f4f7fa" stroke="#ccd7e2"/><text x="375" y="410" font-size="10" fill="#52606d">Out: Gắn nhãn Tag &amp; Mức độ ưu tiên SLA</text>
    <rect x="655" y="155" width="70" height="23" rx="4" fill="#ffffff" stroke="#b7c7d7"/><text x="690" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#24364d">BƯỚC 03</text>
    <rect x="820" y="155" width="80" height="23" rx="4" fill="#fff4dd" stroke="#e69b0d"/><text x="860" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#c47700">3x HANDOFFS</text>
    <text x="665" y="210" font-size="17" font-weight="bold" fill="#142038">Tra cứu &amp; Điều phối</text><text x="665" y="230" font-size="12" fill="#52606d">Nhân viên CSKH / Điều vận</text>
    <rect x="665" y="242" width="78" height="24" rx="5" fill="#e69100"/><text x="704" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">TG: 4 phút</text>
    <text x="665" y="290" font-size="12" fill="#34465c">Chuyển giao thông tin qua nhiều phần mềm</text><text x="665" y="307" font-size="12" fill="#34465c">rời rạc, tùy theo kết quả phân loại:</text>
    <text x="665" y="332" font-size="12" fill="#34465c">• Khiếu nại: tra cứu KTV / group tòa nhà</text><text x="665" y="349" font-size="12" fill="#34465c">• Thủ tục: tra cứu Sổ tay Cư dân</text><text x="665" y="366" font-size="12" fill="#34465c">• 3 lần chuyển tiếp giữa các nhóm nghiệp vụ</text>
    <rect x="665" y="388" width="235" height="31" rx="5" fill="#f4f7fa" stroke="#ccd7e2"/><text x="675" y="401" font-size="10" fill="#52606d">In: Danh bạ phòng công &amp; File quy chế</text><text x="675" y="414" font-size="10" font-weight="bold" fill="#34465c">Out: Gán KTV xử lý hoặc link biểu mẫu</text>
    <rect x="955" y="155" width="70" height="23" rx="4" fill="#ffffff" stroke="#b7c7d7"/><text x="990" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#24364d">BƯỚC 04</text>
    <rect x="1125" y="155" width="80" height="23" rx="4" fill="#ffe7e8" stroke="#ed1c24"/><text x="1165" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#d01820">BOTTLENECK</text>
    <text x="965" y="210" font-size="17" font-weight="bold" fill="#142038">Soạn tin &amp; Phản hồi</text><text x="965" y="230" font-size="12" fill="#52606d">Nhân viên CSKH / Lễ tân</text>
    <rect x="965" y="242" width="78" height="24" rx="5" fill="#ed1c24"/><text x="1004" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">TG: 6 phút</text>
    <text x="965" y="290" font-size="12" fill="#34465c">Soạn thảo văn bản phản hồi cá nhân hóa</text><text x="965" y="307" font-size="12" fill="#34465c">cho từng trường hợp:</text>
    <text x="965" y="332" font-size="12" fill="#34465c">• Gõ tay câu trả lời giải thích thủ tục</text><text x="965" y="349" font-size="12" fill="#34465c">• Cam kết thời gian xử lý thủ công</text><text x="965" y="366" font-size="12" fill="#34465c">• Cư dân bức xúc nếu câu trả lời chậm</text>
    <rect x="965" y="388" width="235" height="31" rx="5" fill="#f4f7fa" stroke="#ccd7e2"/><text x="975" y="401" font-size="10" fill="#52606d">In: Thông tin tiếp nhận &amp; Mẫu chuẩn</text><text x="975" y="414" font-size="10" font-weight="bold" fill="#c51f28">Out: SMS / In-App gửi tới cư dân</text>
  </g>
