  <rect x="660" y="531" width="225" height="23" rx="4" fill="#ed1c24"/><text x="772" y="547" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff">BƯỚC 05: ĐIỀU PHỐI KHẨN CẤP</text>
  <text x="895" y="547" font-family="Arial" font-size="12" font-weight="bold" fill="#c51f28">Thời gian: &lt; 30 GIÂY | Hotline BQL &amp; KTV 24/7</text>
  <text x="665" y="570" font-family="Arial" font-size="11" fill="#34465c">• Bỏ qua hàng đợi thông thường, trích xuất tòa/căn hộ và gọi trực tiếp hotline hiện trường.</text>

  <rect x="50" y="630" width="395" height="150" rx="9" fill="#ffffff" stroke="#cbd7e4"/>
  <text x="65" y="657" font-family="Arial" font-size="16" font-weight="bold" fill="#142038">THỰC TRẠNG VẬN HÀNH THỦ CÔNG</text><line x1="65" y1="667" x2="430" y2="667" stroke="#d8e0e8"/>
  <text x="65" y="693" font-family="Arial" font-size="12" fill="#52606d">• Tổng thời gian xử lý thủ công:</text><text x="315" y="693" font-family="Arial" font-size="12" font-weight="bold" fill="#ed1c24">18 phút / ticket</text>
  <text x="65" y="715" font-family="Arial" font-size="12" fill="#52606d">• Thời gian xử lý cao điểm:</text><text x="260" y="715" font-family="Arial" font-size="12" font-weight="bold" fill="#ed1c24">2 giờ đến 12 giờ</text>
  <text x="65" y="737" font-family="Arial" font-size="12" fill="#52606d">• Bottleneck:</text><text x="145" y="737" font-family="Arial" font-size="12" font-weight="bold" fill="#ed1c24">Bước 2 &amp; 4 (12/18 phút)</text>
  <text x="65" y="759" font-family="Arial" font-size="12" font-weight="bold" fill="#52606d">• Handoff:</text><text x="130" y="759" font-family="Arial" font-size="12" font-weight="bold" fill="#e69100">3 lần chuyển giao rời rạc</text>

  <rect x="465" y="630" width="475" height="150" rx="9" fill="#eef9ff" stroke="#0787cf" stroke-width="2"/>
  <text x="480" y="657" font-family="Arial" font-size="16" font-weight="bold" fill="#0071b5">MỤC TIÊU ĐỘT PHÁ VỚI VINHOMES SERVICE COPILOT</text><line x="480" y="667" x2="925" y2="667" stroke="#b8e2f6"/>
  <rect x="485" y="685" width="135" height="78" rx="7" fill="#ffffff" stroke="#0787cf"/><text x="552" y="714" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0071b5">&lt; 2 PHÚT</text><text x="552" y="735" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#142038">Thời gian phản hồi</text><text x="552" y="752" text-anchor="middle" font-family="Arial" font-size="10" fill="#52606d">Giảm 12-14 phút</text>
  <rect x="635" y="685" width="135" height="78" rx="7" fill="#ffffff" stroke="#0787cf"/><text x="702" y="714" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0071b5">≥ 96%</text><text x="702" y="735" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#142038">Độ chính xác phân loại</text><text x="702" y="752" text-anchor="middle" font-family="Arial" font-size="10" fill="#52606d">Đúng kỹ thuật / thủ tục</text>
  <rect x="785" y="685" width="135" height="78" rx="7" fill="#ffffff" stroke="#0787cf"/><text x="852" y="714" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#0071b5">100%</text><text x="852" y="735" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#142038">Bắt trợ khẩn cấp</text><text x="852" y="752" text-anchor="middle" font-family="Arial" font-size="10" fill="#52606d">Cảnh báo dưới 30 giây</text>

  <rect x="960" y="630" width="390" height="150" rx="9" fill="#ffffff" stroke="#cbd7e4"/>
  <text x="975" y="657" font-family="Arial" font-size="16" font-weight="bold" fill="#142038">CHÚ GIẢI &amp; QUẢN TRỊ</text><line x="975" y="667" x2="1335" y2="667" stroke="#d8e0e8"/>
  <text x="975" y="693" font-family="Arial" font-size="12" font-weight="bold" fill="#ed1c24">[!] Bottleneck</text><text x="1070" y="693" font-family="Arial" font-size="12" fill="#52606d">Điểm nghẽn tốn thời gian</text>
  <text x="975" y="715" font-family="Arial" font-size="12" font-weight="bold" fill="#e69100">[↔] Handoff</text><text x="1070" y="715" font-family="Arial" font-size="12" fill="#52606d">Chuyển giao giữa phần mềm</text>
  <text x="975" y="737" font-family="Arial" font-size="12" font-weight="bold" fill="#168447">[V] HITL</text><text x="1070" y="737" font-family="Arial" font-size="12" fill="#52606d">Con người duyệt tin [DRAFT_ONLY]</text>
  <text x="975" y="759" font-family="Arial" font-size="12" font-weight="bold" fill="#0071b5">[+] Co-pilot</text><text x="1070" y="759" font-family="Arial" font-size="12" fill="#52606d">AI chuẩn bị tag và bản nháp</text>
